[tool.poetry]
name = "market-events-service"
version = "0.1.0"
description = "FastAPI service aggregating market events from multiple providers"
authors = ["OpenAI <support@openai.com>"]
readme = "README.md"
packages = [{ include = "app" }, { include = "providers" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
sqlalchemy = "^2.0.36"
asyncpg = "^0.30.0"
redis = "^5.0.8"
pydantic-settings = "^2.6.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
